    debug_left_rect_topic: "/x1/stereo/debug/left_rect"
    debug_right_rect_topic: "/x1/stereo/debug/right_rect"
    debug_disparity_topic: "/x1/stereo/debug/disparity"
    debug_depth_topic: "/x1/stereo/debug/depth"
    debug_valid_mask_topic: "/x1/stereo/debug/valid_mask"
