# 地面/桌面坐标系节点默认参数。
#
# 该节点从深度图反投影出相机系点云，用 RANSAC 拟合最大水平平面（桌面/地面），
# 建立 ground 坐标系并广播 ground <- camera 的 TF。
# 相机俯仰可动时，每帧都从深度重新估计桌面平面，camera -> ground 变换自动更新。
ground_plane_node:
  ros__parameters:
    depth_topic: "/x1/stereo/depth"
    camera_info_topic: "/x1/left_camera/camera_info"
    plane_topic: "/x1/ground/plane"
    status_topic: "/x1/ground/plane_status"
    camera_frame: "left_camera_optical_frame"
    ground_frame: "ground"
    publish_period_sec: 0.30
    min_depth_m: 0.20
    max_depth_m: 1.50
    sample_step: 2
    max_points: 6000
    ransac_distance_threshold: 0.02
    ransac_iterations: 120
    min_inlier_ratio: 0.20
    publish_tf: true
