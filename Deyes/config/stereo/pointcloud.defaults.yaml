stereo_pointcloud_node:
  ros__parameters:
    # This node consumes only CUDA depth and its synchronized rectified CameraInfo.
    depth_topic: "/x1/stereo/depth"
    rectified_camera_info_topic: "/x1/stereo/left/camera_info_rect"
    points_topic: "/x1/stereo/points"
    status_topic: "/x1/stereo/points_status"
    calibration_id: "unassigned"
    # Set true only from a physical checkerboard calibration YAML/report that passed all gates.
    calibration_validated: false
    min_depth_m: 0.20
    max_depth_m: 1.00
    publish_period_sec: 0.07
    sample_step: 2
    queue_size: 8
