imx219_stereo_capture_node:
  ros__parameters:
    left_sensor_id: 0
    right_sensor_id: 1
    width: 640
    height: 360
    fps: 30
    output_encoding: "mono8"
    # Launch supplies the package-owned debug calibration or an explicit physical YAML.
    calib_path: ""
    left_image_topic: "/x1/left_camera/image_raw"
    right_image_topic: "/x1/right_camera/image_raw"
    left_info_topic: "/x1/left_camera/camera_info"
    right_info_topic: "/x1/right_camera/camera_info"
    left_frame_id: "left_camera_optical_frame"
    right_frame_id: "right_camera_optical_frame"
    publish_info: true
    target_publish_hz: 30.0
    pair_max_skew_ms: 20.0
    frame_stale_sec: 0.2
    # A no-sample nvargus/appsink stall is distinct from a skew rejection.  The
    # C++ process exits after this timeout; launch respawns the whole camera pair.
    capture_stall_sec: 2.0
    capture_startup_grace_sec: 8.0
    history_size: 8
    log_stats_period_sec: 2.0
    reuse_latest_frame: false
    rotate_180: true
    mirror_horizontal: true
    swap_left_right: false
